name: Build T1000E Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build T1000E Companion Radio BLE firmware
      run: pio run -e t1000e_companion_radio_ble -t create_uf2

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: t1000e-firmware-uf2
        path: .pio/build/t1000e_companion_radio_ble/firmware.uf2
        if-no-files-found: error

    - name: Upload firmware to release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: .pio/build/t1000e_companion_radio_ble/firmware.uf2
        asset_name: t1000e-companion-radio-ble-${{ github.event.release.tag_name }}.uf2
        asset_content_type: application/octet-stream
